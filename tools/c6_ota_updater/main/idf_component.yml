# cmd_nvs and cmd_system were local-path dependencies on ${IDF_PATH}/examples/... .
# That only works when the project and ESP-IDF are on the same Windows drive:
# the component manager writes local components into dependencies.lock as paths
# relative to the project, and with IDF on C: and this tree on D: the lock dump
# fails with "ValueError: path is on mount 'C:', start on mount 'D:'".
#
# Both are vendored under components/ instead, where the build system finds them
# automatically — no dependency entry needed. Re-copy from ESP-IDF if they ever
# need updating:
#   ${IDF_PATH}/examples/system/console/advanced/components/{cmd_nvs,cmd_system}
dependencies:
  espressif/esp_hosted:
    rules:
    - if: target in [esp32p4, esp32h2]
    version: '*'
  espressif/esp_wifi_remote:
    rules:
    - if: target in [esp32p4, esp32h2]
    - if: idf_version <6.1
    version: '>=1.3.1'
  joltwallet/littlefs:
    version: '*'
