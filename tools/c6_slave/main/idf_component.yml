# cmd_system was a local-path dependency on ${IDF_PATH}/examples/... . That
# only works when the project and ESP-IDF sit on the same Windows drive: the
# component manager writes local components into dependencies.lock as paths
# relative to the project, and with IDF on C: and this tree on D: the lock dump
# dies with "ValueError: path is on mount 'C:', start on mount 'D:'".
#
# The component is five files with no dependencies of its own, so it is vendored
# at components/cmd_system instead, where the build system picks it up
# automatically as a project component — no dependency entry needed. Re-copy it
# from ESP-IDF if it ever needs updating:
#   ${IDF_PATH}/examples/system/console/advanced/components/cmd_system
dependencies:
  espressif/iperf:
    version: "~0.1.4"
  espressif/iperf-cmd:
    matches:
      - if: "idf_version >=6.0"
        version: "~0.1.3"
      - if: "idf_version <6.0"
        version: "~0.1.1"
  esp-qa/wifi-cmd:
    matches:
      - if: "idf_version >=6.0"
        version: "~0.2.0"
      - if: "idf_version >=5.5,<6.0"
        version: "~0.2.2"
      - if: "idf_version >=5.4,<5.5"
        version: "~0.1.8"
      - if: "idf_version >=5.3,<5.4"
        version: "~0.1.0"
  esp-qa/ping-cmd:
    version: "~1.0.0"
  espressif/mqtt:
    matches:
      - if: "idf_version >5.3"
        version: "~1"
